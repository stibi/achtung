version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
    ignore:
      # Pinned on purpose, see docs/adr/0003-quality-enforcement.md (tool compatibility).
      - dependency-name: typescript
        versions: [">=7"]
      - dependency-name: vitest
        versions: [">=5"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

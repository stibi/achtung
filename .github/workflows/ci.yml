name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server run check

  website:
    name: Website check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir website run check

  image:
    name: Server image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Built only, never pushed: releases are built and pushed by the deployment's own CI.
      - run: docker build --build-arg VERSION=ci --build-arg GIT_COMMIT=${{ github.sha }} -t achtung:ci .
      - name: Starts and fails fast without a database
        run: |
          if docker run --rm --read-only achtung:ci > out.log 2>&1; then
            echo "expected a configuration error"; exit 1
          fi
          grep -q DATABASE_URL out.log

  macos:
    name: macOS check
    # macos-latest has only Xcode 26, which can't target macOS 27. See ADR 0004.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select --switch /Applications/Xcode_27.2.app
      - run: brew install xcodegen swiftlint periphery
      - run: macos/scripts/check.sh

  macos-domain-linux:
    name: Swift packages on Linux
    runs-on: ubuntu-latest
    container: swift:6.4.2-noble@sha256:bca121f6eb59fd80340d1296887b2698ed8f3eb9eca7d80c181f8af769dc7ee0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test --package-path macos/Packages/AchtungDomain
      # Also resolves the spec symlink (Sources/AchtungAPI/openapi.yaml -> api/openapi.yaml).
      - run: swift test --package-path macos/Packages/AchtungAPI

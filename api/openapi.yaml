openapi: 3.0.3
info:
  title: Achtung
  description: "Self-hosted alert inbox. No authentication: see ADR 0002."
  version: 0.1.0
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Channel:
      type: object
      properties:
        instance:
          type: string
          description: The sending system the channel belongs to, e.g. a cluster
        slug:
          type: string
        firing:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Occurrences in the channel that are firing now
        lastEventAt:
          nullable: true
          description: Latest event in the channel
          type: string
          format: date-time
      required:
        - instance
        - slug
        - firing
        - lastEventAt
    Occurrence:
      type: object
      properties:
        id:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        instance:
          type: string
          description: The instance of the channel
        channel:
          type: string
        source:
          type: string
        sourceKey:
          type: string
          description: Identity of the alert in its source, e.g. a fingerprint
        status:
          type: string
          enum:
            - firing
            - resolved
        severity:
          type: string
          enum:
            - critical
            - warning
            - info
            - unknown
        title:
          type: string
        summary:
          nullable: true
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        links:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - source
                  - runbook
                  - dashboard
              url:
                type: string
            required:
              - kind
              - url
        startsAt:
          type: string
          format: date-time
        endsAt:
          nullable: true
          description: Set exactly when the status is resolved
          type: string
          format: date-time
        firstReceivedAt:
          type: string
          format: date-time
        lastReceivedAt:
          type: string
          format: date-time
        lastEventAt:
          type: string
          format: date-time
          description: Last time it fired, resolved, reopened or was resent (at most
            hourly, while firing)
        lastEventKind:
          type: string
          enum:
            - fired
            - resolved
            - reopened
            - resent
          description: "What happened at lastEventAt; resent: Alertmanager repeated an
            alert that is still firing"
        notificationCount:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        silencedUntil:
          nullable: true
          description: When the Alertmanager silence muting this alert ends; null when
            none does, or when its Alertmanager can't be asked
          type: string
          format: date-time
      required:
        - id
        - instance
        - channel
        - source
        - sourceKey
        - status
        - severity
        - title
        - summary
        - labels
        - annotations
        - links
        - startsAt
        - endsAt
        - firstReceivedAt
        - lastReceivedAt
        - lastEventAt
        - lastEventKind
        - notificationCount
        - silencedUntil
    Event:
      type: object
      properties:
        id:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        kind:
          type: string
          enum:
            - fired
            - resolved
            - reopened
            - resent
        cause:
          nullable: true
          description: "Null when a notification caused the event. vanished: a resolve
            Achtung recorded itself, because the alert was gone from its
            Alertmanager"
          type: string
          enum:
            - vanished
        recordedAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - cause
        - recordedAt
    OccurrenceDetail:
      type: object
      properties:
        occurrence:
          $ref: "#/components/schemas/Occurrence"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
          description: Oldest first
        otherOccurrences:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
          description: Other occurrences of the same alert, newest first, at most 20
      required:
        - occurrence
        - events
        - otherOccurrences
    ChannelList:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
      required:
        - channels
    OccurrencePage:
      type: object
      properties:
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
        nextCursor:
          nullable: true
          description: Pass as cursor for the next page; null on the last
          type: string
      required:
        - occurrences
        - nextCursor
    IrmHeartbeat:
      type: object
      properties:
        status:
          type: string
          enum:
            - receiving
            - missing
            - unknown
          description: "receiving: IRM has no open missed-heartbeat alert group for the
            integration; missing: it has one; unknown: IRM was never read
            successfully"
        since:
          nullable: true
          description: While missing, when IRM opened the group for it; else null
          type: string
          format: date-time
        lastMissedFrom:
          nullable: true
          description: While receiving, when the last missed heartbeat started; else null
          type: string
          format: date-time
        lastMissedTo:
          nullable: true
          description: While receiving, when IRM resolved the last missed heartbeat; else
            null
          type: string
          format: date-time
        checkedAt:
          nullable: true
          description: When IRM was last read successfully; the fields above are from that
            read
          type: string
          format: date-time
        error:
          nullable: true
          description: Why the latest read of IRM failed; null when it worked
          type: string
      required:
        - status
        - since
        - lastMissedFrom
        - lastMissedTo
        - checkedAt
        - error
      description: Whether Grafana IRM receives the heartbeat this Alertmanager sends
        it, read at most once a minute
    OpenAlertCounts:
      type: object
      properties:
        total:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        critical:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        warning:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        info:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        other:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: No severity label, or one Achtung doesn't know
      required:
        - total
        - critical
        - warning
        - info
        - other
    MissingAlert:
      type: object
      properties:
        fingerprint:
          type: string
          description: Alertmanager's fingerprint, an occurrence's sourceKey
        title:
          type: string
          description: The alertname
        severity:
          type: string
          enum:
            - critical
            - warning
            - info
            - unknown
        startsAt:
          type: string
          format: date-time
      required:
        - fingerprint
        - title
        - severity
        - startsAt
    Delivery:
      type: object
      properties:
        missingInAchtung:
          type: array
          items:
            $ref: "#/components/schemas/MissingAlert"
          description: Notifying in Alertmanager for over 10 minutes, routed to a receiver
            that delivers to Achtung, but not firing in Achtung. Oldest first
        staleInAchtung:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
          description: "Firing in Achtung, last notified over 10 minutes before the read,
            but gone from Alertmanager: a resolve that never arrived. Oldest
            first"
      required:
        - missingInAchtung
        - staleInAchtung
    AlertmanagerOverview:
      type: object
      properties:
        instance:
          type: string
        reachable:
          type: boolean
          description: Whether the latest read of its alerts succeeded
        error:
          nullable: true
          description: Why the latest read failed; null when reachable
          type: string
        checkedAt:
          nullable: true
          description: When its alerts were last read successfully; the fields below are
            from that read
          type: string
          format: date-time
        open:
          nullable: true
          description: Alerts that are notifying (not silenced or inhibited), by severity;
            null when never read
          allOf:
            - $ref: "#/components/schemas/OpenAlertCounts"
        silenced:
          nullable: true
          type: integer
          minimum: 0
          maximum: 9007199254740991
        inhibited:
          nullable: true
          description: Inhibited and not silenced
          type: integer
          minimum: 0
          maximum: 9007199254740991
        watchdog:
          nullable: true
          description: Whether the Watchdog alert is there, i.e. the alerting pipeline
            works; also while Watchdog is an ignored name
          type: string
          enum:
            - firing
            - absent
        delivery:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Delivery"
        irm:
          nullable: true
          description: Null when Grafana IRM isn't configured, or the Alertmanager has no
            IRM integration
          allOf:
            - $ref: "#/components/schemas/IrmHeartbeat"
      required:
        - instance
        - reachable
        - error
        - checkedAt
        - open
        - silenced
        - inhibited
        - watchdog
        - delivery
        - irm
      description: Counts and delivery leave out the ignored alert names
        (/api/settings/ignored-alerts), e.g. Watchdog, which fires all the time
    Matcher:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        isRegex:
          type: boolean
        isEqual:
          type: boolean
          description: False negates the match (!= or !~)
      required:
        - name
        - value
        - isRegex
        - isEqual
    Silence:
      type: object
      properties:
        instance:
          type: string
        id:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        createdBy:
          type: string
        comment:
          type: string
        matchers:
          type: array
          items:
            $ref: "#/components/schemas/Matcher"
      required:
        - instance
        - id
        - startsAt
        - endsAt
        - createdBy
        - comment
        - matchers
    NoisyAlert:
      type: object
      properties:
        occurrence:
          $ref: "#/components/schemas/Occurrence"
        events:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Its fired, reopened and resent events in the last 24 hours
      required:
        - occurrence
        - events
    Home:
      type: object
      properties:
        alertmanagers:
          type: array
          items:
            $ref: "#/components/schemas/AlertmanagerOverview"
          description: Every configured Alertmanager, by instance name
        silences:
          type: array
          items:
            $ref: "#/components/schemas/Silence"
          description: Silences active now on every Alertmanager, the soonest to end first
        noisiest:
          type: array
          items:
            $ref: "#/components/schemas/NoisyAlert"
          description: Up to 10 alerts with 2 or more events in the last 24 hours, most
            first, each as its newest occurrence
        longestFiring:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
          description: Up to 10 firing occurrences, the earliest start first
      required:
        - alertmanagers
        - silences
        - noisiest
        - longestFiring
    AlertmanagerAlert:
      type: object
      properties:
        fingerprint:
          type: string
          description: Alertmanager's fingerprint, an occurrence's sourceKey
        title:
          type: string
          description: The alertname, else the fingerprint
        severity:
          type: string
          enum:
            - critical
            - warning
            - info
            - unknown
        summary:
          nullable: true
          description: The summary annotation, else the description
          type: string
        startsAt:
          type: string
          format: date-time
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        state:
          type: string
          enum:
            - active
            - silenced
            - inhibited
          description: "active: notifying, or not routed yet; silenced: a silence mutes
            it, inhibited or not; inhibited: only inhibited"
        silencedUntil:
          nullable: true
          description: When the latest silence muting it ends; null unless silenced, or
            when Achtung doesn't know that silence yet
          type: string
          format: date-time
        occurrenceId:
          nullable: true
          description: The occurrence of this firing (same fingerprint and startsAt) on
            the instance; null when Achtung has none
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
      required:
        - fingerprint
        - title
        - severity
        - summary
        - startsAt
        - labels
        - annotations
        - state
        - silencedUntil
        - occurrenceId
    AlertmanagerAlertList:
      type: object
      properties:
        instance:
          type: string
        reachable:
          type: boolean
          description: Whether the latest read of its alerts succeeded
        error:
          nullable: true
          description: Why the latest read failed; null when reachable
          type: string
        checkedAt:
          nullable: true
          description: When its alerts were last read successfully; the fields below are
            from that read
          type: string
          format: date-time
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertmanagerAlert"
          description: By severity (critical, warning, info, unknown), then the newest
            start first; empty when never read
      required:
        - instance
        - reachable
        - error
        - checkedAt
        - alerts
      description: "The alerts the tile counts: active ones are open, the others
        silenced and inhibited. Leaves out the ignored alert names
        (/api/settings/ignored-alerts)"
    IgnoredAlertNames:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
          description: Alert names, sorted
      required:
        - names
      description: Alert names the Home views leave out of an Alertmanager's counts,
        its alert list and its delivery check. Matched exactly and
        case-sensitively against the alertname label. The inbox shows these
        alerts as usual
    AlertsSilenced:
      type: object
      properties:
        alerts:
          type: array
          items:
            type: object
            properties:
              fingerprint:
                type: string
              silencedUntil:
                nullable: true
                description: When its silence ends; null when it wasn't silenced
                type: string
                format: date-time
              error:
                nullable: true
                description: Why it wasn't silenced; null when it was
                type: string
            required:
              - fingerprint
              - silencedUntil
              - error
      required:
        - alerts
      description: One entry per fingerprint asked for, in that order
    IngestSummary:
      type: object
      properties:
        alerts:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        new:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Occurrences that fired or reopened
        resolved:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - alerts
        - new
        - resolved
paths:
  /ingest/alertmanager/{instance}/{channel}:
    post:
      operationId: ingestAlertmanager
      summary: Webhook for alertmanager. The body is the source's own payload.
      tags:
        - ingest
      parameters:
        - schema:
            type: string
          in: path
          name: instance
          required: true
          description: The sending system, e.g. one cluster; created on first use
        - schema:
            type: string
          in: path
          name: channel
          required: true
          description: Created on first use
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestSummary"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ingest/alertmanager/{channel}:
    post:
      operationId: ingestAlertmanagerWithoutInstance
      summary: "Webhook for alertmanager, without an instance. Deprecated: use the URL
        with one."
      tags:
        - ingest
      description: A name one named instance has resolves to its channel; otherwise
        the default instance's channel is used, created if needed.
      parameters:
        - schema:
            type: string
          in: path
          name: channel
          required: true
          description: Created on first use
      deprecated: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestSummary"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/channels:
    get:
      operationId: listChannels
      summary: All channels, by instance and name, with what is firing in each
      tags:
        - client
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
  /api/instances/{instance}/channels/{slug}/occurrences:
    get:
      operationId: listInstanceChannelOccurrences
      summary: A channel's occurrences, most recently changed first
      tags:
        - client
      parameters:
        - schema:
            type: string
            enum:
              - firing
              - resolved
          in: query
          name: status
          required: false
        - schema:
            type: string
          in: query
          name: cursor
          required: false
          description: nextCursor from the previous page
        - schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
          in: query
          name: limit
          required: false
        - schema:
            type: string
            maxLength: 200
            pattern: ^[^\0]*$
          in: query
          name: q
          required: false
          description: Text found, ignoring case and taken literally, in the title, the
            summary or a label's name or value (ADR 0017)
        - schema:
            type: array
            items:
              type: string
              pattern: ^[^\0]*$
          in: query
          name: label
          required: false
          description: "name=value: the label with exactly this value; repeat for several,
            all must match"
        - schema:
            type: array
            items:
              type: string
              enum:
                - critical
                - warning
                - info
                - unknown
          in: query
          name: severity
          required: false
          description: Any of these severities; repeat for several
        - schema:
            type: string
          in: query
          name: instance
          required: false
          description: Only this instance's occurrences
        - schema:
            type: string
          in: path
          name: instance
          required: true
        - schema:
            type: string
          in: path
          name: slug
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrencePage"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/channels/{slug}/occurrences:
    get:
      operationId: listChannelOccurrences
      summary: "A channel's occurrences, by name only. Deprecated: use the route with
        an instance."
      tags:
        - client
      description: The name resolves to the one named instance's channel of that name,
        else to the default instance's.
      parameters:
        - schema:
            type: string
            enum:
              - firing
              - resolved
          in: query
          name: status
          required: false
        - schema:
            type: string
          in: query
          name: cursor
          required: false
          description: nextCursor from the previous page
        - schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
          in: query
          name: limit
          required: false
        - schema:
            type: string
            maxLength: 200
            pattern: ^[^\0]*$
          in: query
          name: q
          required: false
          description: Text found, ignoring case and taken literally, in the title, the
            summary or a label's name or value (ADR 0017)
        - schema:
            type: array
            items:
              type: string
              pattern: ^[^\0]*$
          in: query
          name: label
          required: false
          description: "name=value: the label with exactly this value; repeat for several,
            all must match"
        - schema:
            type: array
            items:
              type: string
              enum:
                - critical
                - warning
                - info
                - unknown
          in: query
          name: severity
          required: false
          description: Any of these severities; repeat for several
        - schema:
            type: string
          in: query
          name: instance
          required: false
          description: Only this instance's occurrences
        - schema:
            type: string
          in: path
          name: slug
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrencePage"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/occurrences:
    get:
      operationId: listOccurrences
      summary: Every channel's occurrences in one list, most recently changed first
      tags:
        - client
      parameters:
        - schema:
            type: string
            enum:
              - firing
              - resolved
          in: query
          name: status
          required: false
        - schema:
            type: string
          in: query
          name: cursor
          required: false
          description: nextCursor from the previous page
        - schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
          in: query
          name: limit
          required: false
        - schema:
            type: string
            maxLength: 200
            pattern: ^[^\0]*$
          in: query
          name: q
          required: false
          description: Text found, ignoring case and taken literally, in the title, the
            summary or a label's name or value (ADR 0017)
        - schema:
            type: array
            items:
              type: string
              pattern: ^[^\0]*$
          in: query
          name: label
          required: false
          description: "name=value: the label with exactly this value; repeat for several,
            all must match"
        - schema:
            type: array
            items:
              type: string
              enum:
                - critical
                - warning
                - info
                - unknown
          in: query
          name: severity
          required: false
          description: Any of these severities; repeat for several
        - schema:
            type: string
          in: query
          name: instance
          required: false
          description: Only this instance's occurrences
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrencePage"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/occurrences/{id}:
    get:
      operationId: getOccurrence
      summary: One occurrence with its history and the alert's other occurrences
      tags:
        - client
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceDetail"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/occurrences/{id}/silence:
    post:
      operationId: silenceOccurrence
      summary: Silence the occurrence's alert on its instance's Alertmanager
      tags:
        - client
      description: "Silences the alert until durationSeconds from now, with an
        Alertmanager silence that matches every label of the alert exactly, so
        it also covers a re-fire. If the alert already has such a silence, it is
        changed to end then, sooner or later, instead of another being added
        (ADR 0015). It mutes the alert for every receiver of that Alertmanager,
        not only Achtung (ADR 0008). 409: the instance has no Alertmanager
        configured. 502: Alertmanager was unreachable or refused the silence."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                durationSeconds:
                  type: integer
                  minimum: 60
                  maximum: 2592000
                  description: How long the silence lasts, from now
              required:
                - durationSeconds
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: unsilenceOccurrence
      summary: End the occurrence's alert's own silences on its instance's Alertmanager
      tags:
        - client
      description: "Ends now every silence that matches exactly this alert's labels,
        as POST creates them, so the alert notifies again. A broader silence,
        which mutes other alerts too, is left alone: the answer's silencedUntil
        then still shows it, and when only such a silence mutes the alert,
        nothing is ended and the answer is 409 (ADR 0015). Ending an alert that
        has no silence is not an error. 409: also when the instance has no
        Alertmanager configured. 502: Alertmanager was unreachable or refused."
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/alertmanagers/{instance}/silences:
    post:
      operationId: silenceAlertmanagerAlerts
      summary: Silence several of an Alertmanager's alerts, each exactly
      tags:
        - client
      description: "Silences each alert, found by fingerprint in a fresh read of the
        instance's Alertmanager, with its own silence matching exactly its
        labels, as POST /api/occurrences/{id}/silence does: an exact silence it
        already has is changed to the new end (ADR 0015, ADR 0016). Alerts not
        in Achtung can be silenced too. An alert no longer in Alertmanager gets
        an error and no silence. It mutes the alerts for every receiver of that
        Alertmanager, not only Achtung. 404: the instance has no Alertmanager
        configured. 502: Alertmanager was unreachable or refused; some silences
        may be made, and a retry changes them rather than adding more."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fingerprints:
                  minItems: 1
                  maxItems: 500
                  type: array
                  items:
                    type: string
                    minLength: 1
                  description: The alerts to silence, each by its fingerprint in this Alertmanager
                durationSeconds:
                  type: integer
                  minimum: 60
                  maximum: 2592000
                  description: How long the silence lasts, from now
              required:
                - fingerprints
                - durationSeconds
      parameters:
        - schema:
            type: string
          in: path
          name: instance
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsSilenced"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/home:
    get:
      operationId: getHome
      summary: Each Alertmanager's state, active silences, and the noisiest and
        longest alerts
      tags:
        - client
      description: Counts come from each Alertmanager, read at most every 30 seconds;
        an unreachable one keeps its last read. delivery compares that read with
        what fires in Achtung, and only reports (ADR 0010).
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
  /api/alertmanagers/{instance}/alerts:
    get:
      operationId: listAlertmanagerAlerts
      summary: The alerts behind an Alertmanager's tile on Home
      tags:
        - client
      description: "From the same read as /api/home's counts, so they agree: active
        alerts are its open, the others its silenced and inhibited. An
        unreachable Alertmanager keeps its last read. 404 when the instance has
        no Alertmanager configured."
      parameters:
        - schema:
            type: string
          in: path
          name: instance
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertmanagerAlertList"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/settings/ignored-alerts:
    get:
      operationId: getIgnoredAlertNames
      summary: The alert names the Home views leave out
      tags:
        - client
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IgnoredAlertNames"
    put:
      operationId: setIgnoredAlertNames
      summary: Replace the alert names the Home views leave out
      tags:
        - client
      description: "One list shared by every client. It applies to the next request,
        also to a cached Alertmanager read. Watchdog's heart on Home doesn't
        depend on it. 400: an empty name, one over 200 characters, or over 200
        names."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                names:
                  maxItems: 200
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
                    description: An alertname; surrounding whitespace is trimmed
                  description: The whole new list; a name given twice is stored once
              required:
                - names
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IgnoredAlertNames"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

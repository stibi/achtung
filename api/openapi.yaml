openapi: 3.0.3
info:
  title: Achtung
  description: "Self-hosted alert inbox. No authentication: see ADR 0002."
  version: 0.1.0
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Channel:
      type: object
      properties:
        instance:
          type: string
          description: The sending system the channel belongs to, e.g. a cluster
        slug:
          type: string
        firing:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Occurrences in the channel that are firing now
        lastEventAt:
          nullable: true
          description: Latest event in the channel
          type: string
          format: date-time
      required:
        - instance
        - slug
        - firing
        - lastEventAt
    Occurrence:
      type: object
      properties:
        id:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        instance:
          type: string
          description: The instance of the channel
        channel:
          type: string
        source:
          type: string
        sourceKey:
          type: string
          description: Identity of the alert in its source, e.g. a fingerprint
        status:
          type: string
          enum:
            - firing
            - resolved
        severity:
          type: string
          enum:
            - critical
            - warning
            - info
            - unknown
        title:
          type: string
        summary:
          nullable: true
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        links:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - source
                  - runbook
                  - dashboard
              url:
                type: string
            required:
              - kind
              - url
        startsAt:
          type: string
          format: date-time
        endsAt:
          nullable: true
          description: Set exactly when the status is resolved
          type: string
          format: date-time
        firstReceivedAt:
          type: string
          format: date-time
        lastReceivedAt:
          type: string
          format: date-time
        lastEventAt:
          type: string
          format: date-time
          description: Last time it fired, resolved, reopened or was resent (at most
            hourly, while firing)
        lastEventKind:
          type: string
          enum:
            - fired
            - resolved
            - reopened
            - resent
          description: "What happened at lastEventAt; resent: Alertmanager repeated an
            alert that is still firing"
        notificationCount:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        silencedUntil:
          nullable: true
          description: When the Alertmanager silence muting this alert ends; null when
            none does, or when its Alertmanager can't be asked
          type: string
          format: date-time
      required:
        - id
        - instance
        - channel
        - source
        - sourceKey
        - status
        - severity
        - title
        - summary
        - labels
        - annotations
        - links
        - startsAt
        - endsAt
        - firstReceivedAt
        - lastReceivedAt
        - lastEventAt
        - lastEventKind
        - notificationCount
        - silencedUntil
    Event:
      type: object
      properties:
        id:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        kind:
          type: string
          enum:
            - fired
            - resolved
            - reopened
            - resent
        recordedAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - recordedAt
    OccurrenceDetail:
      type: object
      properties:
        occurrence:
          $ref: "#/components/schemas/Occurrence"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
          description: Oldest first
        otherOccurrences:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
          description: Other occurrences of the same alert, newest first, at most 20
      required:
        - occurrence
        - events
        - otherOccurrences
    ChannelList:
      type: object
      properties:
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
      required:
        - channels
    OccurrencePage:
      type: object
      properties:
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/Occurrence"
        nextCursor:
          nullable: true
          description: Pass as cursor for the next page; null on the last
          type: string
      required:
        - occurrences
        - nextCursor
    IngestSummary:
      type: object
      properties:
        alerts:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        new:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Occurrences that fired or reopened
        resolved:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - alerts
        - new
        - resolved
paths:
  /ingest/alertmanager/{instance}/{channel}:
    post:
      operationId: ingestAlertmanager
      summary: Webhook for alertmanager. The body is the source's own payload.
      tags:
        - ingest
      parameters:
        - schema:
            type: string
          in: path
          name: instance
          required: true
          description: The sending system, e.g. one cluster; created on first use
        - schema:
            type: string
          in: path
          name: channel
          required: true
          description: Created on first use
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestSummary"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /ingest/alertmanager/{channel}:
    post:
      operationId: ingestAlertmanagerWithoutInstance
      summary: "Webhook for alertmanager, without an instance. Deprecated: use the URL
        with one."
      tags:
        - ingest
      description: A name one named instance has resolves to its channel; otherwise
        the default instance's channel is used, created if needed.
      parameters:
        - schema:
            type: string
          in: path
          name: channel
          required: true
          description: Created on first use
      deprecated: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestSummary"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/channels:
    get:
      operationId: listChannels
      summary: All channels, by instance and name, with what is firing in each
      tags:
        - client
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
  /api/instances/{instance}/channels/{slug}/occurrences:
    get:
      operationId: listInstanceChannelOccurrences
      summary: A channel's occurrences, most recently changed first
      tags:
        - client
      parameters:
        - schema:
            type: string
            enum:
              - firing
              - resolved
          in: query
          name: status
          required: false
        - schema:
            type: string
          in: query
          name: cursor
          required: false
          description: nextCursor from the previous page
        - schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
          in: query
          name: limit
          required: false
        - schema:
            type: string
          in: path
          name: instance
          required: true
        - schema:
            type: string
          in: path
          name: slug
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrencePage"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/channels/{slug}/occurrences:
    get:
      operationId: listChannelOccurrences
      summary: "A channel's occurrences, by name only. Deprecated: use the route with
        an instance."
      tags:
        - client
      description: The name resolves to the one named instance's channel of that name,
        else to the default instance's.
      parameters:
        - schema:
            type: string
            enum:
              - firing
              - resolved
          in: query
          name: status
          required: false
        - schema:
            type: string
          in: query
          name: cursor
          required: false
          description: nextCursor from the previous page
        - schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
          in: query
          name: limit
          required: false
        - schema:
            type: string
          in: path
          name: slug
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrencePage"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/occurrences:
    get:
      operationId: listOccurrences
      summary: Every channel's occurrences in one list, most recently changed first
      tags:
        - client
      parameters:
        - schema:
            type: string
            enum:
              - firing
              - resolved
          in: query
          name: status
          required: false
        - schema:
            type: string
          in: query
          name: cursor
          required: false
          description: nextCursor from the previous page
        - schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
          in: query
          name: limit
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrencePage"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/occurrences/{id}:
    get:
      operationId: getOccurrence
      summary: One occurrence with its history and the alert's other occurrences
      tags:
        - client
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceDetail"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/occurrences/{id}/silence:
    post:
      operationId: silenceOccurrence
      summary: Silence the occurrence's alert on its instance's Alertmanager
      tags:
        - client
      description: "Creates an Alertmanager silence that matches every label of the
        alert exactly, so it also covers a re-fire. It mutes the alert for every
        receiver of that Alertmanager, not only Achtung (ADR 0008). 409: the
        instance has no Alertmanager configured. 502: Alertmanager was
        unreachable or refused the silence."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                durationSeconds:
                  type: integer
                  minimum: 60
                  maximum: 2592000
                  description: How long the silence lasts, from now
              required:
                - durationSeconds
      parameters:
        - schema:
            type: integer
            minimum: 0
            exclusiveMinimum: true
            maximum: 9007199254740991
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occurrence"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

# Git hooks for every contributor and every agent (Claude, Codex, humans).
# Installed automatically by `pnpm install` (the root `prepare` script).
pre-commit:
  jobs:
    - name: server-check
      root: server/
      glob: "server/**"
      run: pnpm run check
    - name: macos
      root: macos/
      glob: "macos/**"
      # The app builds only on macOS; elsewhere CI covers it.
      skip:
        - run: test "$(uname -s)" != Darwin
      run: scripts/check.sh

commit-msg:
  jobs:
    - name: conventional-commit
      run: scripts/check-commit-msg.sh {1}

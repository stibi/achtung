# Git hooks for every contributor and every agent (Claude, Codex, humans).
# Installed automatically by `pnpm install` (the root `prepare` script).
pre-commit:
  jobs:
    - name: server-check
      root: server/
      glob: "server/**"
      run: pnpm run check
    - name: website
      # The site also shows the app's media and icon. No `root:` here: lefthook would
      # then drop the staged files outside website/ before matching these globs.
      glob:
        - "website/**"
        - "docs/media/**"
        - "macos/Icon/**"
      run: pnpm --dir website run check
    - name: macos
      root: macos/
      glob: "macos/**"
      # The app builds only on macOS; elsewhere CI covers it.
      skip:
        - run: test "$(uname -s)" != Darwin
      run: scripts/check.sh

commit-msg:
  jobs:
    - name: conventional-commit
      run: scripts/check-commit-msg.sh {1}

packages:
  - server
  - website
# Build scripts are opt-in. The denied ones are optional native speedups (ssh2,
# cpu-features: Docker over SSH in Testcontainers), binary checks (esbuild, used by
# drizzle-kit and Astro; workerd, used by wrangler) or postinstall notices; everything
# works without them.
allowBuilds:
  lefthook: true
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  workerd: false
